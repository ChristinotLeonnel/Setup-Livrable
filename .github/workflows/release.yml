# Publication d'une version de TSA ou de TSALab dans les Releases de ce dépôt (téléchargées par le site).
#
# Lancement manuel (Actions > Publier une version > Run workflow). Le code est pris dans le dépôt public du
# produit, au commit `ref` ; la version demandée doit être celle de product/ProductIdentity.h. Aucune Release
# n'est créée si `publish` est décoché (essai : fichiers disponibles comme artefacts du flux), ni si un test,
# la vérification du paquet ou l'essai de l'installateur échoue.
#
# Étiquette : <produit>-v<version> (tsa-v0.1.0, tsalab-v0.2.0-rc.1). Fichiers : installateur, archive portable,
# source de Gmsh (GPL), source d'IfcOpenShell (LGPL), SHA256SUMS.txt.

name: Publier une version

on:
  workflow_dispatch:
    inputs:
      product:
        description: Logiciel
        type: choice
        options: [tsa, tsalab]
        default: tsa
      version:
        description: Version (celle de ProductIdentity.h, ex. 0.1.0 ou 0.2.0-rc.1)
        required: true
      ref:
        description: Branche, étiquette ou commit du dépôt du code
        default: main
      publish:
        description: Créer la Release (sinon essai sans publication)
        type: boolean
        default: false

permissions:
  contents: write

env:
  QT_VERSION: 6.11.2
  OCCT_VERSION: 8.0.1
  GMSH_VERSION: 4.15.2
  OPENSEES_VERSION: 3.8.0
  IFCOPENSHELL_VERSION: 0.9.0post1
  IFCOPENSHELL_SHA256: 2776eef7ddc0137df317f0294623523dc4ccdaba468c172232cfdda13f4e912a
  MESA_VERSION: 26.2.3
  MESA_SHA256: 3f3613adb43cfd0f2e665ce2400b130c275f0b3317cb3a05566320a3a67589ed

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    outputs:
      commit: ${{ steps.src.outputs.commit }}
      commit_tsa: ${{ steps.src.outputs.commit_tsa }}
      commit_tsalab: ${{ steps.src.outputs.commit_tsalab }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Produit
        id: prod
        run: |
          $p = '${{ inputs.product }}'
          $name = @{ tsa = 'TSA'; tsalab = 'TSALab' }[$p]
          $repo = @{ tsa = 'Tsaraloha-Structural-Analysis'; tsalab = 'Tsaraloha-Structural-Analysis-Virtual-Laboratory' }[$p]
          "name=$name" >> $env:GITHUB_OUTPUT
          "repo=ChristinotLeonnel/$repo" >> $env:GITHUB_OUTPUT

      # Les deux dépôts sont toujours nécessaires : TSALab se construit sur les bibliothèques de TSA (../TSA), et
      # TSA utilise le cœur scientifique de TSALab (../TSALab/science). Le dépôt du produit est pris à `ref`,
      # l'autre à main ; les deux commits figurent dans les notes (code source correspondant, GPL).
      - name: Code de TSA
        uses: actions/checkout@v4
        with:
          repository: ChristinotLeonnel/Tsaraloha-Structural-Analysis
          ref: ${{ inputs.product == 'tsa' && inputs.ref || 'main' }}
          path: TSA
      - name: Code de TSALab
        uses: actions/checkout@v4
        with:
          repository: ChristinotLeonnel/Tsaraloha-Structural-Analysis-Virtual-Laboratory
          ref: ${{ inputs.product == 'tsalab' && inputs.ref || 'main' }}
          path: TSALab
      # Scripts de ce dépôt (scripts/run_tests.ps1), au commit du flux lancé.
      - name: Scripts de publication
        uses: actions/checkout@v4
        with:
          path: livrable

      - name: Commit et version
        id: src
        run: |
          $dir = '${{ steps.prod.outputs.name }}'
          $commit = git -C $dir rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "commit_tsa=$(git -C TSA rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "commit_tsalab=$(git -C TSALab rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          # Dépôt voisin compilé dans la version : cité par licenses/Gmsh/SOURCE.txt.
          $extra = if ($dir -eq 'TSA') { "https://github.com/ChristinotLeonnel/Tsaraloha-Structural-Analysis-Virtual-Laboratory/tree/$(git -C TSALab rev-parse HEAD)" }
                   else { "https://github.com/ChristinotLeonnel/Tsaraloha-Structural-Analysis/tree/$(git -C TSA rev-parse HEAD)" }
          "extra_source=$extra" >> $env:GITHUB_OUTPUT
          $declared = (Select-String -Path "$dir/product/ProductIdentity.h" -Pattern 'kVersion\[\] = "([^"]+)"').Matches[0].Groups[1].Value
          if ($declared -ne '${{ inputs.version }}') { throw "Version demandée ${{ inputs.version }} ≠ ProductIdentity.h $declared" }
          Write-Host "$dir $declared au commit $commit"

      - name: Dépendances en cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: win-occt${{ env.OCCT_VERSION }}-gmsh${{ env.GMSH_VERSION }}-opensees${{ env.OPENSEES_VERSION }}

      # Sources officielles uniquement : versions publiées d'OCCT (GitHub), SDK de Gmsh (gmsh.info),
      # exécutable d'OpenSees (Université de Californie, Berkeley).
      - name: Téléchargement des dépendances
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force deps, dl | Out-Null
          $occt = "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V$env:OCCT_VERSION"
          Invoke-WebRequest "$occt/opencascade-release-no-pch.zip" -OutFile dl/occt.zip
          Expand-Archive dl/occt.zip dl/occt
          Expand-Archive (Get-ChildItem dl/occt -Filter *.zip).FullName deps
          Invoke-WebRequest "$occt/3rdparty-vc14-64.zip" -OutFile dl/3rdparty.zip
          Expand-Archive dl/3rdparty.zip dl/3rdparty
          $inner = Get-ChildItem dl/3rdparty -Filter *.zip
          if ($inner) { Expand-Archive $inner[0].FullName deps } else { Move-Item dl/3rdparty/* deps }
          Invoke-WebRequest "https://gmsh.info/bin/Windows/gmsh-$env:GMSH_VERSION-Windows64-sdk.zip" -OutFile dl/gmsh.zip
          Expand-Archive dl/gmsh.zip deps
          Invoke-WebRequest "https://opensees.berkeley.edu/OpenSees/code/OpenSees$env:OPENSEES_VERSION-x64.exe.zip" -OutFile dl/opensees.zip
          Expand-Archive dl/opensees.zip dl/opensees
          Move-Item "dl/opensees/OpenSees$env:OPENSEES_VERSION" deps/OpenSees
          Get-ChildItem deps | Format-Table Name

      - name: Dépendances à leur place
        run: |
          Copy-Item -Recurse "deps/opencascade-$env:OCCT_VERSION-vc14-64" TSA/
          Copy-Item -Recurse deps/3rdparty-vc14-64 TSA/
          New-Item -ItemType Directory -Force TSA/thirdparty | Out-Null
          Copy-Item -Recurse "deps/gmsh-$env:GMSH_VERSION-Windows64-sdk" TSA/thirdparty/
          Copy-Item -Recurse deps/OpenSees TSA/thirdparty/
          Get-ChildItem TSA/thirdparty, TSA/thirdparty/OpenSees -Recurse -Depth 1 | Select-Object -First 20 FullName

      # Qt 6.11 range ses paquets Windows par architecture : seul aqtinstall postérieur à la 3.3.0 les trouve
      # (« Support Qt 6.11+ for Windows X64 », non encore publié) ; commit fixé pour une construction reproductible.
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Compilateur MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ninja et Inno Setup
        run: choco install ninja innosetup -y --no-progress

      # Import IFC complet : IfcOpenShell (LGPL-3.0) compilé contre l'OCCT de TSA par le script du dépôt (versions et
      # empreintes figées). Cache indexé sur le script : toute modification le recompile.
      - name: IfcOpenShell en cache
        id: ifcos-cache
        uses: actions/cache@v4
        with:
          path: |
            TSA/thirdparty/ifcopenshell-${{ env.IFCOPENSHELL_VERSION }}
            TSA/thirdparty/boost-1.92.0
            TSA/thirdparty/eigen-3.4.1
          key: win-ifcopenshell${{ env.IFCOPENSHELL_VERSION }}-occt${{ env.OCCT_VERSION }}-${{ hashFiles('TSA/scripts/build_ifcopenshell.ps1') }}

      - name: Compilation d'IfcOpenShell
        if: steps.ifcos-cache.outputs.cache-hit != 'true'
        run: |
          ./TSA/scripts/build_ifcopenshell.ps1 -WorkDir "$env:RUNNER_TEMP/ifcos"
          Get-Content "TSA/thirdparty/ifcopenshell-$env:IFCOPENSHELL_VERSION/TSA-BUILD.json"

      - name: Configuration
        run: >
          cmake -S ${{ steps.prod.outputs.name }} -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTSA_REQUIRE_IFCOPENSHELL=ON
          -DTSA_PACKAGE_GMSH=ON
          -DTSA_BUILD_TESTS=ON
          -DTSA_SOURCE_REF=${{ steps.src.outputs.commit }}
          -DTSA_EXTRA_SOURCE_URLS=${{ steps.src.outputs.extra_source }}

      - name: Compilation
        run: cmake --build build

      # Tests en deux passes (scripts/run_tests.ps1). Les suites qui ouvrent une vraie vue 3D (OCCT) ne peuvent pas
      # tourner sous la plateforme Qt « offscreen » (arrêt 0xC0000409, BUG-076 de TSA) : elles passent en plateforme
      # Qt native sur le bureau de la session du runner, avec le rendu OpenGL logiciel de Mesa (pas de carte graphique).
      # Un test sauté, une suite absente ou un total incomplet font échouer la passe native.
      - name: Tests sans vue 3D (plateforme Qt offscreen)
        id: tests-offscreen
        run: ./livrable/scripts/run_tests.ps1 -BuildDir build -Platform offscreen -Product ${{ steps.prod.outputs.name }}

      # Mesa (licence MIT), version et empreinte figées : seulement pour les tests, jamais dans le paquet (les deux DLL
      # sont posées à côté de l'exécutable des tests le temps de la passe, puis retirées).
      - name: Rendu OpenGL logiciel pour les tests (Mesa)
        if: inputs.product == 'tsa' && (success() || steps.tests-offscreen.outcome == 'failure')
        run: |
          $archive = "$env:RUNNER_TEMP/mesa.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $env:MESA_SHA256) { throw "empreinte de Mesa $env:MESA_VERSION inattendue" }
          7z x -y "-o$env:RUNNER_TEMP/mesa" $archive | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/mesa/x64/opengl32.dll", "$env:RUNNER_TEMP/mesa/x64/libgallium_wgl.dll" | Format-Table Name, Length

      # TSALab n'enregistre que sa suite propre (TSALab_LabTests), sans vue 3D : passe native réservée à TSA.
      - name: Tests à vue 3D (plateforme Qt windows)
        if: inputs.product == 'tsa' && (success() || steps.tests-offscreen.outcome == 'failure')
        run: ./livrable/scripts/run_tests.ps1 -BuildDir build -Platform windows -Product TSA -SoftwareOpenGL "$env:RUNNER_TEMP/mesa/x64" -Log "$env:RUNNER_TEMP/tests-vue3d.log"

      - name: Journal des tests à vue 3D
        if: failure() && inputs.product == 'tsa'
        uses: actions/upload-artifact@v4
        with:
          name: tests-vue3d-log
          path: ${{ runner.temp }}/tests-vue3d.log
          if-no-files-found: warn

      - name: Paquet, vérification et installateur
        run: |
          cmake --build build --target installer_${{ steps.prod.outputs.name }}
          python TSA/tools/verify_package.py build/dist/${{ steps.prod.outputs.name }}

      - name: Essai de l'installateur (installation, démarrage, désinstallation)
        run: |
          $name = '${{ steps.prod.outputs.name }}'
          $setup = (Resolve-Path "build/dist/$name-${{ inputs.version }}-windows-x64-setup.exe").Path
          $inst = Join-Path $env:RUNNER_TEMP "inst-$name"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$inst`"", "/LOG=`"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 40; throw "installation : code $($p.ExitCode)" }
          foreach ($f in "$name.exe", 'LICENSE.txt', 'MANIFEST.json', 'licenses/Gmsh/SOURCE.txt', 'ifcopenshell.parse.dll',
                         'ifcopenshell_geometry_kernel_opencascade.dll', 'licenses/IfcOpenShell/COPYING.LESSER', 'licenses/IfcOpenShell/SOURCE.txt') {
            if (-not (Test-Path (Join-Path $inst $f))) { throw "absent après installation : $f" }
          }
          $u = Start-Process (Join-Path $inst 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          for ($t = 0; $t -lt 60 -and (Test-Path (Join-Path $inst "$name.exe")); $t++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $inst "$name.exe")) { throw 'désinstallation incomplète' }
          Write-Host "installation et désinstallation : OK"

      - name: Fichiers de la version
        run: |
          $name = '${{ steps.prod.outputs.name }}'
          $v = '${{ inputs.version }}'
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "build/dist/$name-$v-windows-x64-setup.exe" out/
          Compress-Archive -Path "build/dist/$name/*" -DestinationPath "out/$name-$v-windows-x64.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # GPL de Gmsh et LGPL d'IfcOpenShell : une copie non modifiée de chaque source accompagne chaque version
      # (licenses/Gmsh/SOURCE.txt, licenses/IfcOpenShell/SOURCE.txt) ; l'archive d'IfcOpenShell est vérifiée par son
      # empreinte, la même que celle du script de compilation.
      - name: Sources de Gmsh et d'IfcOpenShell, empreintes
        run: |
          curl -fsSL -o "out/gmsh-${GMSH_VERSION}-source.tgz" "https://gmsh.info/src/gmsh-${GMSH_VERSION}-source.tgz"
          curl -fsSL -o "out/ifcopenshell-${IFCOPENSHELL_VERSION}-source.tar.gz" \
            "https://github.com/IfcOpenShell/IfcOpenShell/archive/refs/tags/ifcopenshell-python-${IFCOPENSHELL_VERSION}.tar.gz"
          echo "${IFCOPENSHELL_SHA256}  out/ifcopenshell-${IFCOPENSHELL_VERSION}-source.tar.gz" | sha256sum -c -
          cd out
          for f in *; do [ -s "$f" ] || { echo "fichier vide : $f"; exit 1; }; done
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notes de publication
        env:
          COMMIT: ${{ needs.windows.outputs.commit }}
          COMMIT_TSA: ${{ needs.windows.outputs.commit_tsa }}
          COMMIT_TSALAB: ${{ needs.windows.outputs.commit_tsalab }}
        run: |
          case "${{ inputs.product }}" in
            tsa) name=TSA; repo=Tsaraloha-Structural-Analysis ;;
            *)   name=TSALab; repo=Tsaraloha-Structural-Analysis-Virtual-Laboratory ;;
          esac
          {
            echo "$name ${{ inputs.version }} pour Windows 10/11 x64."
            echo
            echo "- **Installateur** : \`$name-${{ inputs.version }}-windows-x64-setup.exe\` (pour l'utilisateur courant, sans droits administrateur)."
            echo "- **Version portable** : \`$name-${{ inputs.version }}-windows-x64.zip\`."
            echo "- **Empreintes SHA-256** : \`SHA256SUMS.txt\`. Vérification : \`(Get-FileHash -Algorithm SHA256 <fichier>).Hash.ToLower()\`."
            echo
            echo "Code source (licence MIT), commits construits :"
            echo "- TSA : https://github.com/ChristinotLeonnel/Tsaraloha-Structural-Analysis/tree/$COMMIT_TSA"
            echo "- TSALab : https://github.com/ChristinotLeonnel/Tsaraloha-Structural-Analysis-Virtual-Laboratory/tree/$COMMIT_TSALAB"
            echo "Cette version contient Gmsh ${GMSH_VERSION} (GNU GPL) : elle est distribuée, dans son ensemble, selon les termes de la GPL ; source de Gmsh jointe (\`gmsh-${GMSH_VERSION}-source.tgz\`)."
            echo "Import IFC par IfcOpenShell ${IFCOPENSHELL_VERSION} (GNU LGPL v3, DLL remplaçables) : source jointe (\`ifcopenshell-${IFCOPENSHELL_VERSION}-source.tar.gz\`), script de compilation dans le dépôt de TSA (\`scripts/build_ifcopenshell.ps1\`)."
            echo "OpenSees ${OPENSEES_VERSION} est livré sous sa propre licence (usage éducatif, de recherche et non lucratif sans accord de l'Université de Californie)."
            echo
            echo "Les fichiers ne sont pas signés : Windows SmartScreen peut afficher un avertissement. Les résultats de calcul doivent être vérifiés par un ingénieur qualifié."
          } > notes.md
          cat notes.md

      - name: Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.product }}-v${{ inputs.version }}"
          name=$([ "${{ inputs.product }}" = tsa ] && echo TSA || echo TSALab)
          pre=""; case "${{ inputs.version }}" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$name ${{ inputs.version }}" --notes-file notes.md $pre
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"

      # Après publication : les empreintes calculées par GitHub doivent être celles de SHA256SUMS.txt.
      - name: Vérification après publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.product }}-v${{ inputs.version }}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | sort -k2 > published.txt
          grep -v SHA256SUMS.txt out/SHA256SUMS.txt | sort -k2 > expected.txt
          grep -v SHA256SUMS.txt published.txt > published-files.txt
          diff expected.txt published-files.txt && echo "empreintes publiées conformes"
